name: Self-Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest-ppc64le

    steps:
      - name: Test runner
        run: |
          echo "Hello from self-hosted runner!"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Architecture: $(uname -m)"
          echo "OS: $(. /etc/os-release && echo "$PRETTY_NAME")"
